<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>検索サイト</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .container {
            background: white;
            padding: 60px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 600px;
            width: 90%;
        }
          
        .search-container {
            gap: 10px;
            margin-bottom: 40px;
        }
        
        .search-input {
            flex: 1;
            padding: 15px;
            font-size: 16px;
            border: 2px solid #ddd;
            border-radius: 8px;
            transition: border-color 0.3s;
            width: 200px;
        }
        
        .search-input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .search-button {
            padding: 20px 30px;
            font-size: 16px;
            font-weight: bold;
            background-color: #4285f4;
            color: white;
            border: none;
            border-radius: 8px;
            transition: background-color 0.3s;
        }
        
        .search-button:hover {
            background-color: #357ae8;
        }
        
        .search-button:active {
            transform: scale(0.98);
        }
        
        /* タイマースタイル */
        .timer-section {
            background: linear-gradient(135deg, #ff6b6b 0%, #feca57 100%);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 40px;
            border: 2px solid #ff5252;
        }
        
        .timer-section h3 {
            margin-bottom: 15px;
            color: white;
            font-size: 16px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
        }
        
        .timer-display {
            background: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 48px;
            font-weight: bold;
            color: #ff6b6b;
            font-family: 'Courier New', monospace;
            letter-spacing: 5px;
        }
        @media screen and (max-width: 479px) {
            .timer-display {font-size: 25px;}
        }
        
        .timer-input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .timer-input {
            width: 80px;
            padding: 10px;
            font-size: 14px;
            border: 2px solid white;
            border-radius: 6px;
            text-align: center;
            background: rgba(255, 255, 255, 0.9);
        }
        
        .timer-input:focus {
            outline: none;
            background: white;
            box-shadow: 0 0 8px rgba(0, 0, 0, 0.2);
        }
        
        .timer-input:disabled {
            background: rgba(255, 255, 255, 0.5);
            cursor: not-allowed;
            opacity: 0.6;
        }
        
        .timer-label {
            color: white;
            font-size: 12px;
            font-weight: bold;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
        }
        
        .timer-input-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }
        
        .timer-button-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .timer-button {
            padding: 10px 20px;
            font-size: 14px;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
            color: white;
        }
        
        .timer-start {
            background-color: #2ecc71;
        }
        
        .timer-start:hover {
            background-color: #27ae60;
        }
        
        .timer-start:disabled {
            background-color: #95a5a6;
            cursor: not-allowed;
            opacity: 0.6;
        }
        
        .timer-pause {
            background-color: #f39c12;
        }
        
        .timer-pause:hover {
            background-color: #e67e22;
        }
        
        .timer-pause:disabled {
            background-color: #95a5a6;
            cursor: not-allowed;
            opacity: 0.6;
        }
        
        .timer-reset {
            background-color: #e74c3c;
        }
        
        .timer-reset:hover {
            background-color: #c0392b;
        }
        
        .timer-reset:disabled {
            background-color: #95a5a6;
            cursor: not-allowed;
            opacity: 0.6;
        }
        
        .custom-site-section {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 40px;
            border: 2px solid #e0e0e0;
        }
        
        .custom-site-section h3 {
            margin-bottom: 15px;
            color: #333;
            font-size: 14px;
        }
        
        .custom-site-input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .custom-site-input {
            flex: 1;
            min-width: 200px;
            padding: 12px;
            font-size: 14px;
            border: 2px solid #ddd;
            border-radius: 8px;
            transition: border-color 0.3s;
        }
        
        .custom-site-input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .custom-site-button {
            padding: 12px 20px;
            font-size: 14px;
            font-weight: bold;
            background-color: #4caf50;
            color: white;
            border: none;
            border-radius: 8px;
            transition: background-color 0.3s;
            cursor: pointer;
        }
        
        .custom-site-button:hover {
            background-color: #45a049;
        }
        
        .custom-site-button:active {
            transform: scale(0.98);
        }
        
        .button-group {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .video-button {
            padding: 15px 40px;
            margin-bottom: -15px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            width: 200px;
        }
        
        .youtube-button {
            background-color: #ff0000;
            color: white;
        }
        
        .youtube-button:hover {
            background-color: #cc0000;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(255, 0, 0, 0.4);
        }
        
        .niconico-button {
            background-color: #f2c211;
            color: #333;
        }
        
        .niconico-button:hover {
            background-color: #e6b800;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(242, 194, 17, 0.4);
        }
        
        .video-button:active {
            transform: translateY(-1px);
        }
        
        .custom-sites-list {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .custom-site-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 15px;
            background: white;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 13px;
        }
        
        .custom-site-link {
            color: #667eea;
            text-decoration: none;
            cursor: pointer;
            font-weight: bold;
        }
        
        .custom-site-link:hover {
            text-decoration: underline;
        }
        
        .custom-site-delete {
            background: #ff6b6b;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 4px 8px;
            font-size: 12px;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        .custom-site-delete:hover {
            background: #ff5252;
        }

        /* スクリーン点灯状態アイコン */
        .wake-lock-indicator {
            position: fixed;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 12px;
            display: none;
            z-index: 1000;
            align-items: center;
            gap: 6px;
        }

        .wake-lock-indicator.active {
            display: flex;
        }

        .wake-lock-dot {
            width: 8px;
            height: 8px;
            background: #4caf50;
            border-radius: 50%;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 49%, 100% { opacity: 1; }
            50%, 99% { opacity: 0.3; }
        }
    </style>
</head>
<body>
    <div class="wake-lock-indicator" id="wakeLockIndicator">
        <div class="wake-lock-dot"></div>
        <span>スクリーン点灯中</span>
    </div>

    <div class="container">
        
        <!-- 検索ボックス -->
        <div class="search-container">
            <input 
                type="text" 
                class="search-input" 
                placeholder="検索キーワードを入力..."
                id="searchInput"
            >
            <button class="search-button" onclick="googleSearch()">Google</button>
        </div>
        
        <!-- タイマーセクション -->
        <div class="timer-section">
            <h3>⏱️ タイマー</h3>
            <div class="timer-display" id="timerDisplay">00:00:00</div>
            <div class="timer-input-group">
                <div class="timer-input-item">
                    <label class="timer-label">時</label>
                    <input 
                        type="number" 
                        class="timer-input" 
                        id="timerHours"
                        min="0"
                        max="23"
                        value="0"
                    >
                </div>
                <div class="timer-input-item">
                    <label class="timer-label">分</label>
                    <input 
                        type="number" 
                        class="timer-input" 
                        id="timerMinutes"
                        min="0"
                        max="59"
                        value="0"
                    >
                </div>
            </div>
            <div class="timer-button-group">
                <button class="timer-button timer-start" id="startBtn" onclick="startTimer()">開始</button>
                <button class="timer-button timer-pause" id="pauseBtn" onclick="pauseTimer()" disabled>一時停止</button>
                <button class="timer-button timer-reset" id="resetBtn" onclick="resetTimer()">リセット</button>
            </div>
        </div>
        
        <!-- カスタムサイトセクション -->
        <div class="custom-site-section">
            <h3>📌 見るサイト</h3>
            <div class="custom-site-input-group">
                <input 
                    type="text" 
                    class="custom-site-input" 
                    placeholder="https://x.com"
                    id="customSiteInput"
                >
                <button class="custom-site-button" onclick="addCustomSite()">追加</button>
            </div>
            <div class="custom-sites-list" id="customSitesList"></div>
        </div>
        
        <!-- ビデオサイトボタン -->
        <div class="button-group">
            <button class="video-button youtube-button" onclick="goToYouTube()">
                ▶ YouTube
            </button>
            <button class="video-button niconico-button" onclick="goToNicoNico()">
                🎬 ニコニコ
            </button>
        </div>
    </div>

    <script>
        // タイマー変数
        let timerInterval = null;
        let timerSeconds = 0;
        let timerRunning = false;
        let wakeLock = null;

        // Screen Wake Lock API対応
        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                    document.getElementById('wakeLockIndicator').classList.add('active');
                    console.log('Wake Lock acquired');
                }
            } catch (err) {
                console.error('Wake Lock request failed:', err);
            }
        }

        // Wake Lock解除
        function releaseWakeLock() {
            if (wakeLock) {
                wakeLock.release().then(() => {
                    wakeLock = null;
                    document.getElementById('wakeLockIndicator').classList.remove('active');
                    console.log('Wake Lock released');
                });
            }
        }

        // ページが非表示になった時に Wake Lock を解除
        document.addEventListener('visibilitychange', async () => {
            if (document.hidden) {
                releaseWakeLock();
            } else if (timerRunning) {
                await requestWakeLock();
            }
        });

        // タイマー開始
        function startTimer() {
            if (timerRunning) return;
            
            if (timerSeconds === 0) {
                const hours = parseInt(document.getElementById('timerHours').value) || 0;
                const minutes = parseInt(document.getElementById('timerMinutes').value) || 0;
                timerSeconds = hours * 3600 + minutes * 60;
            }
            
            if (timerSeconds <= 0) {
                alert('時間を入力してください');
                return;
            }
            
            timerRunning = true;
            
            // ボタン状態を更新
            document.getElementById('timerHours').disabled = true;
            document.getElementById('timerMinutes').disabled = true;
            document.getElementById('startBtn').disabled = true;
            document.getElementById('pauseBtn').disabled = false;
            document.getElementById('resetBtn').disabled = true;
            
            // Wake Lock リクエスト
            requestWakeLock();
            
            timerInterval = setInterval(() => {
                timerSeconds--;
                updateTimerDisplay();
                
                if (timerSeconds <= 0) {
                    clearInterval(timerInterval);
                    timerRunning = false;
                    releaseWakeLock();
                    alert('タイマー終了！');
                    
                    // ボタン状態をリセット
                    document.getElementById('timerHours').disabled = false;
                    document.getElementById('timerMinutes').disabled = false;
                    document.getElementById('startBtn').disabled = false;
                    document.getElementById('pauseBtn').disabled = true;
                    document.getElementById('resetBtn').disabled = false;
                    
                    resetTimer();
                }
            }, 1000);
        }

        // タイマー一時停止
        function pauseTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerRunning = false;
                releaseWakeLock();
                
                // ボタン状態を更新
                document.getElementById('startBtn').disabled = false;
                document.getElementById('pauseBtn').disabled = true;
                document.getElementById('resetBtn').disabled = false;
            }
        }

        // タイマーリセット
        function resetTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
            }
            timerSeconds = 0;
            timerRunning = false;
            releaseWakeLock();
            
            document.getElementById('timerHours').value = 0;
            document.getElementById('timerMinutes').value = 0;
            document.getElementById('timerHours').disabled = false;
            document.getElementById('timerMinutes').disabled = false;
            document.getElementById('startBtn').disabled = false;
            document.getElementById('pauseBtn').disabled = true;
            document.getElementById('resetBtn').disabled = false;
            
            updateTimerDisplay();
        }

        // タイマー表示更新
        function updateTimerDisplay() {
            const hours = Math.floor(timerSeconds / 3600);
            const minutes = Math.floor((timerSeconds % 3600) / 60);
            const seconds = timerSeconds % 60;
            
            const display = `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
            document.getElementById('timerDisplay').textContent = display;
        }

        // 入力変更時にディスプレイ更新
        document.getElementById('timerHours').addEventListener('input', () => {
            if (!timerRunning) {
                const hours = parseInt(document.getElementById('timerHours').value) || 0;
                const minutes = parseInt(document.getElementById('timerMinutes').value) || 0;
                timerSeconds = hours * 3600 + minutes * 60;
                updateTimerDisplay();
            }
        });

        document.getElementById('timerMinutes').addEventListener('input', () => {
            if (!timerRunning) {
                const hours = parseInt(document.getElementById('timerHours').value) || 0;
                const minutes = parseInt(document.getElementById('timerMinutes').value) || 0;
                timerSeconds = hours * 3600 + minutes * 60;
                updateTimerDisplay();
            }
        });
        
        // LocalStorageからカスタムサイトを読み込む
        function loadCustomSites() {
            const sites = JSON.parse(localStorage.getItem('customSites') || '[]');
            const list = document.getElementById('customSitesList');
            list.innerHTML = '';
            
            sites.forEach((site, index) => {
                const item = document.createElement('div');
                item.className = 'custom-site-item';
                const displayName = site.replace(/https?:\/\//, '').replace(/\/$/, '').substring(0, 30);
                item.innerHTML = `
                    <a href="#" class="custom-site-link" onclick="goToCustomSite('${site.replace(/'/g, "\\'")}'); return false;">${displayName}</a>
                    <button class="custom-site-delete" onclick="deleteCustomSite(${index})">削除</button>
                `;
                list.appendChild(item);
            });
        }
        
        // カスタムサイトを追加
        function addCustomSite() {
            const input = document.getElementById('customSiteInput');
            let url = input.value.trim();
            
            if (!url) {
                alert('URLを入力してください');
                return;
            }
            
            // URLにhttpプロトコルがない場合は追加
            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                url = 'https://' + url;
            }
            
            // URLが有効かチェック
            try {
                new URL(url);
            } catch (e) {
                alert('有効なURLを入力してください');
                return;
            }
            
            const sites = JSON.parse(localStorage.getItem('customSites') || '[]');
            
            // 重複チェック
            if (sites.includes(url)) {
                alert('このサイトは既に追加されています');
                return;
            }
            
            sites.push(url);
            localStorage.setItem('customSites', JSON.stringify(sites));
            input.value = '';
            loadCustomSites();
        }
        
        // カスタムサイトへ移動
        function goToCustomSite(url) {
            window.open(url, '_blank');
        }
        
        // カスタムサイトを削除
        function deleteCustomSite(index) {
            const sites = JSON.parse(localStorage.getItem('customSites') || '[]');
            sites.splice(index, 1);
            localStorage.setItem('customSites', JSON.stringify(sites));
            loadCustomSites();
        }
        
        // Google検索
        function googleSearch() {
            const searchText = document.getElementById('searchInput').value;
            if (searchText.trim()) {
                window.open(`https://www.google.com/search?q=${encodeURIComponent(searchText)}`);
            } else {
                alert('検索キーワードを入力してください');
            }
        }
        
        // YouTube へ移動
        function goToYouTube() {
            window.open('https://www.youtube.com/', '_blank');
        }
        
        // ニコニコ動画へ移動
        function goToNicoNico() {
            window.open('https://www.nicovideo.jp/', '_blank');
        }
        
        // Enterキーで検索できるように
        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                googleSearch();
            }
        });
        
        // カスタムサイト入力でEnterキー対応
        document.getElementById('customSiteInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                addCustomSite();
            }
        });
        
        // ページ読み込み時にカスタムサイトを表示
        loadCustomSites();
        updateTimerDisplay();
    </script>
</body>
</html>
